# Every model and deck ID ever published, in one place. Anki identifies models
# and decks by these integers, not by name, so two decks sharing an ID silently
# merge inside a user's collection — and a model ID that changes orphans the
# notes using it.
#
# Therefore: IDs in this file are historical fact. Record them; never renumber
# a published one. `assert_unique()` fails the build on a collision.
#
# `deck_base_id` is a *range*: a deck reserves base_id + 1 .. base_id + tiers,
# and the combined-with-female-voice build additionally uses base_id + 100 + n.
# Leave generous gaps between bases — the registry checks ranges, not just the
# base values.

[minihongo]
# Three languages x three note types. minihongo's deck IDs were historically
# randomised per build rather than derived from a base; migrating it to this
# base is what makes its builds reproducible.
model_ids = [
    2007390001, 2007390002, 2007390003,  # en: vocab, grammar, listening
    2007390011, 2007390012, 2007390013,  # ja
    2007390021, 2007390022, 2007390023,  # mh
]
deck_base_id = 2007391000
reserved = 200

