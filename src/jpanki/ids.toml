[jp-teaching]
# CORRECTED 2026-07-25. This deck shipped with deck_base_id = 2261602312, the
# same base as `accounting`: whoever added it incremented model_id but not
# deck_base_id. Their tier decks 1-3 therefore both claimed 2261602313-315, so
# importing both decks merged jp-teaching's tiers into accounting's.
#
# Renumbering is the only fix for a collision. Anyone who imported the old
# jp-teaching deck gets its subdecks re-created under the new IDs on next
# import; their review history is attached to notes (which keep their GUIDs),
# not to decks, so scheduling survives — but the old, wrongly-merged subdecks
# must be deleted by hand.
model_ids = [1809594536]
deck_base_id = 2362703413
reserved = 200
previous_deck_base_id = 2261602312

